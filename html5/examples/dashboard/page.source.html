<!doctype html>
<html lang="zh-CN">
<head>
  <title>服务健康看板</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; padding: 0; }
    body { font-size: 16px; line-height: 1.5; color: #153125; background: #f7f1ec; }
    .viz-shell { max-width: 100%; margin: 0 auto; padding: 24px; }
    .viz-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    .viz-toolbar button {
      font: inherit; padding: 6px 12px; border: 2px solid #153125; border-radius: 10px;
      background: #ffffff; cursor: pointer;
    }
    .viz-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .viz-card {
      border: 2px solid #153125; border-radius: 14px; padding: 16px; background: #ffffff;
      cursor: pointer;
    }
    .viz-card.is-selected { outline: 4px solid #008248; }
    .viz-card .viz-label { font-size: 14px; color: #4a5a4f; }
    .viz-card .viz-value { font-size: 28px; font-weight: 700; margin: 4px 0; }
    .viz-card .viz-trend { font-size: 14px; }
    .viz-panel { border: 2px solid #153125; border-radius: 14px; padding: 16px; margin-top: 16px; background: #ffffff; }
    .viz-annotations { border: 2px solid #153125; border-radius: 14px; padding: 12px; margin-top: 12px; background: #f6bdda; }
    .viz-fallback { display: none; }
    @media (max-width: 820px) { .viz-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) { .viz-cards { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <main class="viz-shell">
    <h1>服务健康看板</h1>
    <p>核心服务可用性与性能指标，支持按周期切换并查看指标详情。</p>
    <div class="viz-toolbar" role="toolbar" aria-label="看板工具">
      <button type="button" data-viz-filter="today">今日</button>
      <button type="button" data-viz-filter="week">本周</button>
      <button type="button" data-viz-filter="month">本月</button>
      <button type="button" data-viz-action="toggle">切换备注</button>
    </div>
    <div class="viz-cards">
      <section class="viz-card" data-viz-selectable data-metric-id="availability" tabindex="0">
        <div class="viz-label">可用性</div>
        <div class="viz-value" data-metric-value="availability">99.9%</div>
        <div class="viz-trend" data-metric-trend="availability">↑ 0.1</div>
      </section>
      <section class="viz-card" data-viz-selectable data-metric-id="error-rate" tabindex="0">
        <div class="viz-label">错误率</div>
        <div class="viz-value" data-metric-value="error-rate">0.02%</div>
        <div class="viz-trend" data-metric-trend="error-rate">↓ 0.01</div>
      </section>
      <section class="viz-card" data-viz-selectable data-metric-id="requests" tabindex="0">
        <div class="viz-label">请求量</div>
        <div class="viz-value" data-metric-value="requests">12,400 次/分</div>
        <div class="viz-trend" data-metric-trend="requests">↑ 8%</div>
      </section>
      <section class="viz-card" data-viz-selectable data-metric-id="latency" tabindex="0">
        <div class="viz-label">P95 延迟</div>
        <div class="viz-value" data-metric-value="latency">210 ms</div>
        <div class="viz-trend" data-metric-trend="latency">↓ 12%</div>
      </section>
    </div>
    <section class="viz-panel">
      <p data-viz-state>选择指标卡片或切换周期</p>
    </section>
    <section class="viz-annotations" data-viz-annotations hidden>
      <p>备注：峰值时段为 10:00–11:00，P95 延迟上升约 8%。</p>
    </section>
    <p class="viz-fallback" data-viz-fallback>图表库不可用，上方指标数值仍可直接阅读。</p>
    <p><span data-viz-motion>full</span></p>
  </main>
  <script>
    const state = { selected: null, period: "today", notesVisible: false };
    const stateElement = document.querySelector("[data-viz-state]");
    const annotations = document.querySelector("[data-viz-annotations]");
    const motionIndicator = document.querySelector("[data-viz-motion]");
    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    motionIndicator.textContent = motionQuery.matches ? "reduced" : "full";
    const seriesData = {
      today: {
        availability: ["99.9%", "↑ 0.1"],
        "error-rate": ["0.02%", "↓ 0.01"],
        requests: ["12,400 次/分", "↑ 8%"],
        latency: ["210 ms", "↓ 12%"]
      },
      week: {
        availability: ["99.7%", "↑ 0.3"],
        "error-rate": ["0.05%", "↓ 0.02"],
        requests: ["86,000 次/分", "↑ 5%"],
        latency: ["240 ms", "↓ 8%"]
      },
      month: {
        availability: ["99.5%", "↑ 0.6"],
        "error-rate": ["0.09%", "↓ 0.04"],
        requests: ["352,000 次/分", "↑ 11%"],
        latency: ["270 ms", "↓ 15%"]
      }
    };
    const cards = [...document.querySelectorAll("[data-viz-selectable]")];
    const applyPeriod = () => {
      const data = seriesData[state.period];
      for (const card of cards) {
        const id = card.getAttribute("data-metric-id");
        const value = card.querySelector("[data-metric-value=\"" + id + "\"]");
        const trend = card.querySelector("[data-metric-trend=\"" + id + "\"]");
        value.textContent = data[id][0];
        trend.textContent = data[id][1];
      }
      stateElement.textContent = "周期：" + state.period;
    };
    for (const card of cards) {
      card.addEventListener("click", () => {
        for (const item of cards) item.classList.remove("is-selected");
        card.classList.add("is-selected");
        state.selected = card.getAttribute("data-metric-id");
        stateElement.textContent = "指标：" + state.selected;
      });
    }
    for (const button of document.querySelectorAll("[data-viz-filter]")) {
      button.addEventListener("click", () => {
        state.period = button.getAttribute("data-viz-filter");
        applyPeriod();
      });
    }
    document.querySelector("[data-viz-action=\"toggle\"]").addEventListener("click", () => {
      state.notesVisible = !state.notesVisible;
      annotations.hidden = !state.notesVisible;
      stateElement.textContent = state.notesVisible ? "备注：显示" : "备注：隐藏";
    });
    if (!motionQuery.matches) {
      const loop = () => { requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
