<!doctype html>
<html lang="zh-CN">
<head>
  <title>仓库架构</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; padding: 0; }
    body { font-size: 16px; line-height: 1.5; color: #153125; background: #F7F1EC; }
    .viz-frame {
      width: 100%;
      aspect-ratio: 1600 / 940;
      overflow: hidden;
      position: relative;
      background: #F7F1EC;
    }
    .viz-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1600px;
      height: 940px;
      transform-origin: 0 0;
    }
    .viz-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 20px 28px; }
    .viz-toolbar button {
      font: inherit; font-size: 20px; padding: 10px 20px; border: 2px solid #153125;
      border-radius: 12px; background: #FFFFFF; cursor: pointer;
    }
    .viz-graph { width: 100%; padding: 0 28px; }
    .viz-graph svg { display: block; width: 100%; height: auto; }
    .viz-node { cursor: pointer; }
    .viz-node.is-selected { stroke: #153125; stroke-width: 4; }
    .viz-node.is-hidden { opacity: 0.15; pointer-events: none; }
    .viz-edge { cursor: pointer; }
    .viz-edge.is-selected .viz-edge-line { stroke: #008248; stroke-width: 7; }
    .viz-edge.is-hidden { opacity: 0.1; pointer-events: none; }
    .viz-status { display: flex; gap: 20px; align-items: baseline; padding: 18px 28px 24px; }
    .viz-status p { margin: 0; font-size: 22px; }
    .viz-status .viz-hint { font-size: 18px; color: #5A6B5F; margin-left: auto; }
    .viz-fallback { display: none; }
  </style>
</head>
<body>
  <div class="viz-frame" data-viz-canvas>
    <div class="viz-stage">
      <div class="viz-toolbar" role="toolbar" aria-label="架构图工具">
        <button type="button" data-viz-filter="all">全部</button>
        <button type="button" data-viz-filter="core">核心</button>
        <button type="button" data-viz-filter="render">渲染</button>
        <button type="button" data-viz-filter="publish">发布</button>
        <button type="button" data-viz-filter="support">支撑</button>
        <button type="button" data-viz-action="pan">平移</button>
        <button type="button" data-viz-action="zoom-in">放大</button>
        <button type="button" data-viz-action="zoom-out">缩小</button>
        <button type="button" data-viz-action="reset">重置</button>
      </div>
      <div class="viz-graph">
        <svg viewBox="0 0 1600 760" role="img" aria-label="仓库架构图">
          <defs>
            <marker id="arrow" markerWidth="12" markerHeight="10" refX="8" refY="2.5" orient="auto">
              <path d="M0 0 L8 2.5 L0 5 z"/>
            </marker>
          </defs>
          <rect x="0" y="0" width="1600" height="760" fill="#F7F1EC"/>
          <text x="60" y="80" font-size="40" font-weight="700" fill="#153125">仓库架构：白板与 HTML 双渲染器流水线</text>
          <g class="viz-zoom" style="transform: translate(0px, 0px) scale(1)">
            <rect class="viz-node" data-node-id="user-request" data-node-category="core" data-node-label="用户请求" x="40" y="150" width="200" height="100" rx="24" fill="#008248"/>
            <text x="140" y="194" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">用户请求</text>
            <text x="140" y="226" text-anchor="middle" font-size="16" fill="#FFFFFF">“画一张飞书架构图”</text>

            <rect class="viz-node" data-node-id="routing" data-node-category="core" data-node-label="路由 SKILL.md" x="300" y="150" width="220" height="100" rx="24" fill="#008248"/>
            <text x="410" y="194" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">路由 SKILL.md</text>
            <text x="410" y="226" text-anchor="middle" font-size="16" fill="#FFFFFF">whiteboard / html5-block / dual</text>

            <rect class="viz-node" data-node-id="spec" data-node-category="core" data-node-label="VisualizationSpec" x="580" y="150" width="240" height="100" rx="24" fill="#008248"/>
            <text x="700" y="194" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">VisualizationSpec</text>
            <text x="700" y="226" text-anchor="middle" font-size="16" fill="#FFFFFF">共享语义层与主题</text>

            <rect class="viz-node" data-node-id="whiteboard-renderer" data-node-category="render" data-node-label="白板渲染器" x="120" y="330" width="240" height="100" rx="24" fill="#F6BDDA"/>
            <text x="240" y="374" text-anchor="middle" font-size="24" font-weight="700" fill="#153125">白板渲染器</text>
            <text x="240" y="406" text-anchor="middle" font-size="16" fill="#153125">RULES.md + whiteboard-cli</text>

            <rect class="viz-node" data-node-id="html-renderer" data-node-category="render" data-node-label="HTML 渲染器" x="560" y="330" width="240" height="100" rx="24" fill="#F6BDDA"/>
            <text x="680" y="374" text-anchor="middle" font-size="24" font-weight="700" fill="#153125">HTML 渲染器</text>
            <text x="680" y="406" text-anchor="middle" font-size="16" fill="#153125">build/check/render/publish</text>

            <rect class="viz-node" data-node-id="feishu-doc" data-node-category="publish" data-node-label="飞书文档" x="1080" y="200" width="240" height="280" rx="28" fill="#FCC715"/>
            <text x="1200" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#000000">飞书文档</text>
            <text x="1200" y="334" text-anchor="middle" font-size="16" fill="#000000">可编辑白板</text>
            <text x="1200" y="362" text-anchor="middle" font-size="16" fill="#000000">交互式 HTML5 Block</text>
            <text x="1200" y="390" text-anchor="middle" font-size="16" fill="#000000">支持评论</text>

            <rect class="viz-node" data-node-id="support" data-node-category="support" data-node-label="支撑层" x="40" y="560" width="960" height="160" rx="28" fill="#FFFFFF" stroke="#153125" stroke-width="3"/>
            <text x="520" y="600" text-anchor="middle" font-size="24" font-weight="700" fill="#153125">支撑层</text>
            <text x="520" y="636" text-anchor="middle" font-size="18" fill="#153125">主题模板 CATALOG + templates · 安全策略 scripts/lib · html5 资产 dependencies + tokens</text>
            <text x="520" y="670" text-anchor="middle" font-size="18" fill="#153125">骨架与示例 archetypes + examples · 测试 test/ · 前置检查 preflight</text>

            <g class="viz-edge" data-edge-id="user-to-routing" data-edge-source="user-request" data-edge-target="routing">
              <line x1="240" y1="200" x2="300" y2="200" stroke="transparent" stroke-width="28"/>
              <line class="viz-edge-line" x1="240" y1="200" x2="300" y2="200" stroke="#153125" stroke-width="4" marker-end="url(#arrow)"/>
            </g>
            <g class="viz-edge" data-edge-id="routing-to-spec" data-edge-source="routing" data-edge-target="spec">
              <line x1="520" y1="200" x2="580" y2="200" stroke="transparent" stroke-width="28"/>
              <line class="viz-edge-line" x1="520" y1="200" x2="580" y2="200" stroke="#153125" stroke-width="4" marker-end="url(#arrow)"/>
            </g>
            <g class="viz-edge" data-edge-id="spec-to-whiteboard" data-edge-source="spec" data-edge-target="whiteboard-renderer">
              <polyline points="580,250 580,300 240,300 240,330" fill="none" stroke="transparent" stroke-width="28"/>
              <polyline class="viz-edge-line" points="580,250 580,300 240,300 240,330" fill="none" stroke="#153125" stroke-width="4" marker-end="url(#arrow)"/>
            </g>
            <g class="viz-edge" data-edge-id="spec-to-html" data-edge-source="spec" data-edge-target="html-renderer">
              <line x1="700" y1="250" x2="700" y2="330" stroke="transparent" stroke-width="28"/>
              <line class="viz-edge-line" x1="700" y1="250" x2="700" y2="330" stroke="#153125" stroke-width="4" marker-end="url(#arrow)"/>
            </g>
            <g class="viz-edge" data-edge-id="whiteboard-to-doc" data-edge-source="whiteboard-renderer" data-edge-target="feishu-doc">
              <polyline points="360,380 360,310 1020,310 1080,310" fill="none" stroke="transparent" stroke-width="28"/>
              <polyline class="viz-edge-line" points="360,380 360,310 1020,310 1080,310" fill="none" stroke="#153125" stroke-width="4" marker-end="url(#arrow)"/>
            </g>
            <g class="viz-edge" data-edge-id="html-to-doc" data-edge-source="html-renderer" data-edge-target="feishu-doc">
              <polyline points="800,380 800,470 1020,470 1020,370 1080,370" fill="none" stroke="transparent" stroke-width="28"/>
              <polyline class="viz-edge-line" points="800,380 800,470 1020,470 1020,370 1080,370" fill="none" stroke="#153125" stroke-width="4" marker-end="url(#arrow)"/>
            </g>
            <g class="viz-edge" data-edge-id="support-to-whiteboard" data-edge-source="support" data-edge-target="whiteboard-renderer">
              <line x1="240" y1="560" x2="240" y2="430" stroke="transparent" stroke-width="28"/>
              <line class="viz-edge-line" x1="240" y1="560" x2="240" y2="430" stroke="#153125" stroke-width="4" marker-end="url(#arrow)"/>
            </g>
            <g class="viz-edge" data-edge-id="support-to-html" data-edge-source="support" data-edge-target="html-renderer">
              <line x1="680" y1="560" x2="680" y2="430" stroke="transparent" stroke-width="28"/>
              <line class="viz-edge-line" x1="680" y1="560" x2="680" y2="430" stroke="#153125" stroke-width="4" marker-end="url(#arrow)"/>
            </g>
          </g>
        </svg>
      </div>
      <div class="viz-status">
        <p data-viz-state>就绪：点击节点或连线查看详情</p>
        <p class="viz-hint">文档内为缩放预览，点击右上角「全屏」查看原始尺寸</p>
      </div>
      <p class="viz-fallback" data-viz-fallback hidden>辅助资源不可用时的降级说明。</p>
      <span data-viz-motion hidden>full</span>
    </div>
  </div>
  <script>
    const state = { selected: null, category: "all", panX: 0, scale: 1 };
    const stateElement = document.querySelector("[data-viz-state]");
    const stage = document.querySelector(".viz-stage");
    const group = document.querySelector(".viz-zoom");
    const motionIndicator = document.querySelector("[data-viz-motion]");
    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    motionIndicator.textContent = motionQuery.matches ? "reduced" : "full";
    const nodes = [...document.querySelectorAll("[data-node-id]")];
    const edges = [...document.querySelectorAll("[data-edge-id]")];
    const nodeById = new Map(nodes.map((node) => [node.getAttribute("data-node-id"), node]));
    const applyTransform = () => {
      group.style.transform = "translate(" + state.panX + "px, 0px) scale(" + state.scale + ")";
    };
    const applyFilter = () => {
      for (const node of nodes) {
        const category = node.getAttribute("data-node-category");
        const hidden = state.category !== "all" && category !== state.category;
        node.classList.toggle("is-hidden", hidden);
      }
      for (const edge of edges) {
        const source = nodeById.get(edge.getAttribute("data-edge-source"));
        const target = nodeById.get(edge.getAttribute("data-edge-target"));
        const hidden = source.classList.contains("is-hidden") || target.classList.contains("is-hidden");
        edge.classList.toggle("is-hidden", hidden);
      }
    };
    for (const node of nodes) {
      node.addEventListener("click", () => {
        for (const item of nodes) item.classList.remove("is-selected");
        for (const item of edges) item.classList.remove("is-selected");
        node.classList.add("is-selected");
        state.selected = node.getAttribute("data-node-id");
        stateElement.textContent = "已选择：" + node.getAttribute("data-node-label");
      });
    }
    for (const edge of edges) {
      edge.addEventListener("click", () => {
        for (const item of edges) item.classList.remove("is-selected");
        for (const item of nodes) item.classList.remove("is-selected");
        edge.classList.add("is-selected");
        const sourceId = edge.getAttribute("data-edge-source");
        const targetId = edge.getAttribute("data-edge-target");
        const sourceLabel = nodeById.get(sourceId)?.getAttribute("data-node-label") ?? sourceId;
        const targetLabel = nodeById.get(targetId)?.getAttribute("data-node-label") ?? targetId;
        state.selected = edge.getAttribute("data-edge-id");
        stateElement.textContent = "连线：" + sourceLabel + " → " + targetLabel;
      });
    }
    for (const button of document.querySelectorAll("[data-viz-filter]")) {
      button.addEventListener("click", () => {
        state.category = button.getAttribute("data-viz-filter");
        applyFilter();
        stateElement.textContent = "筛选：" + state.category;
      });
    }
    document.querySelector("[data-viz-action=\"pan\"]").addEventListener("click", () => {
      state.panX = (state.panX + 20) % 60;
      applyTransform();
      stateElement.textContent = "平移：" + state.panX;
    });
    document.querySelector("[data-viz-action=\"zoom-in\"]").addEventListener("click", () => {
      state.scale = Math.min(2, state.scale + 0.25);
      applyTransform();
      stateElement.textContent = "缩放：" + state.scale;
    });
    document.querySelector("[data-viz-action=\"zoom-out\"]").addEventListener("click", () => {
      state.scale = Math.max(0.5, state.scale - 0.25);
      applyTransform();
      stateElement.textContent = "缩放：" + state.scale;
    });
    document.querySelector("[data-viz-action=\"reset\"]").addEventListener("click", () => {
      state.selected = null;
      state.category = "all";
      state.panX = 0;
      state.scale = 1;
      for (const item of nodes) item.classList.remove("is-selected", "is-hidden");
      for (const item of edges) item.classList.remove("is-selected", "is-hidden");
      applyTransform();
      stateElement.textContent = "视图已重置";
    });
    const fit = () => {
      const width = document.documentElement.clientWidth;
      const scale = Math.min(1, width / 1600);
      stage.style.transform = "scale(" + scale + ")";
    };
    window.addEventListener("resize", fit);
    fit();
  </script>
</body>
</html>
