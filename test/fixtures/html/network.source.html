<!doctype html>
<html lang="zh-CN">
<head>
  <title>项目架构</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 16px; line-height: 1.5; color: #1d2b20; background: #f7f1ec; }
    .viz-shell { max-width: 1440px; margin: 0 auto; padding: 24px; }
    .viz-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .viz-toolbar button { font: inherit; padding: 6px 12px; border: 2px solid #153125; border-radius: 6px; background: #fff; cursor: pointer; }
    .viz-layout { display: grid; grid-template-columns: 1fr 300px; gap: 16px; margin-top: 16px; }
    .viz-canvas { min-height: 420px; border: 2px solid #153125; border-radius: 12px; background: #fff; overflow: hidden; }
    .viz-details { border: 2px solid #153125; border-radius: 12px; padding: 16px; background: #fff; }
    .viz-fallback { display: none; }
    @media (max-width: 820px) { .viz-layout { grid-template-columns: 1fr; } }
  </style>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js" integrity="sha384-+8nbzwDAyu5kAjqtR/XKxIgPHQD2TflvbZgeDZn5t3JP+OOogNH1jXnfel8ZAgzS" crossorigin="anonymous"></script>
</head>
<body>
  <main class="viz-shell">
    <h1>项目架构</h1>
    <p>展示内容规划、双渲染器与飞书发布链路</p>
    <div class="viz-toolbar" role="toolbar" aria-label="关系图工具">
      <button type="button" data-viz-action="filter" data-viz-filter="all">全部</button>
      <button type="button" data-viz-action="zoom-in">放大</button>
      <button type="button" data-viz-action="zoom-out">缩小</button>
      <button type="button" data-viz-action="reset">重置</button>
    </div>
    <div class="viz-layout">
      <section class="viz-canvas" data-viz-canvas aria-label="项目架构关系图">
        <svg viewBox="0 0 800 420" role="img" aria-label="项目架构关系图">
          <g class="viz-zoom" style="transform: translate(0px, 0px) scale(1)">
            <rect class="viz-node" data-node-id="planner" x="40" y="60" width="200" height="80" rx="16" fill="#008248"/>
            <rect class="viz-node" data-node-id="renderer" x="320" y="60" width="200" height="80" rx="16" fill="#f6bdda"/>
            <rect class="viz-node" data-node-id="lark" x="580" y="60" width="180" height="80" rx="16" fill="#fcc715"/>
            <line x1="240" y1="100" x2="320" y2="100" stroke="#153125" stroke-width="4"/>
            <line x1="520" y1="100" x2="580" y2="100" stroke="#153125" stroke-width="4"/>
            <text x="140" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">内容规划</text>
            <text x="420" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#153125">双渲染器</text>
            <text x="670" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#153125">飞书发布</text>
          </g>
        </svg>
        <p class="viz-fallback" data-viz-fallback>图表库不可用，关键节点信息仍然可见。</p>
      </section>
      <aside class="viz-details" data-viz-state="idle">选择节点查看详情</aside>
    </div>
  </main>
  <script>
    const state = { selected: null, scale: 1 };
    const details = document.querySelector("[data-viz-state]");
    const zoom = document.querySelector(".viz-zoom");
    const fallback = document.querySelector("[data-viz-fallback]");
    const nodes = document.querySelectorAll(".viz-node");
    for (const node of nodes) {
      node.addEventListener("click", () => {
        state.selected = node.getAttribute("data-node-id");
        details.textContent = "已选择：" + (state.selected ?? "无");
      });
    }
    document.querySelector("[data-viz-action=\"filter\"]").addEventListener("click", () => {
      details.textContent = "筛选：全部";
    });
    document.querySelector("[data-viz-action=\"zoom-in\"]").addEventListener("click", () => {
      state.scale = Math.min(2, state.scale + 0.25);
      zoom.style.transform = "translate(0px, 0px) scale(" + state.scale + ")";
      details.textContent = "缩放：" + state.scale;
    });
    document.querySelector("[data-viz-action=\"zoom-out\"]").addEventListener("click", () => {
      state.scale = Math.max(0.5, state.scale - 0.25);
      zoom.style.transform = "translate(0px, 0px) scale(" + state.scale + ")";
      details.textContent = "缩放：" + state.scale;
    });
    document.querySelector("[data-viz-action=\"reset\"]").addEventListener("click", () => {
      state.scale = 1;
      zoom.style.transform = "translate(0px, 0px) scale(1)";
      details.textContent = "视图已重置";
    });
    window.addEventListener("resize", () => {
      requestAnimationFrame(() => {
        details.dataset.width = String(document.documentElement.clientWidth);
      });
    });
    if (typeof lucide === "undefined") {
      fallback.hidden = false;
    }
  </script>
</body>
</html>
